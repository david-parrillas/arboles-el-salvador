name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORTALDEB_URL: ${{ vars.PORTALDEB_URL || 'https://portaldeb.marn.gob.sv' }}
      # Secreto de Actions (y de Dependabot para sus PRs). Sin él, el build de producción falla a propósito.
      PORTALDEB_TOKEN: ${{ secrets.PORTALDEB_TOKEN }}
      # El certificado del Portal lo firma la CA interna del MARN, que Node no trae.
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/certs/marn-ca.pem
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      # Si PortalDEB no responde (red o 5xx), el build no falla: genera la página sin datos.
      # Si rechaza el token (401/403), el build falla.
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
